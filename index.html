<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clarity</title>
  <meta name="description" content="Clarity is a macOS menu-bar app for students. Press ⌘⇧E on any problem on your screen, read a written explanation in seconds, and watch a custom animation a minute later.">
  <meta name="theme-color" content="#0e141c">
  <link rel="canonical" href="https://adamzhu.dev/clarity-web/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Clarity">
  <meta property="og:description" content="A hotkey that explains any problem on your screen.">
  <meta property="og:url" content="https://adamzhu.dev/clarity-web/">
  <meta property="og:image" content="https://adamzhu.dev/clarity-web/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/clarity-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/site.css">
  <script>
    /* Launch sequence plays on the first visit only. Runs before first paint so there is no flash. */
    (function () {
      try {
        var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var key = 'clarity:seen', seen = localStorage.getItem(key);
        if (!reduced) document.documentElement.classList.add(seen ? 'is-return' : 'is-launch');
        localStorage.setItem(key, '1');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="home">
    <div class="ambient" aria-hidden="true"></div>
    <a class="corner" href="how-it-works.html">How it works</a>

    <div class="hero">
      <div class="mark-wrap" style="view-transition-name: mark">
        <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Clarity app icon: a white ring around a glass magnifier on a slate square">
          <defs>
            <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9b4c3"/><stop offset=".45" stop-color="#3a4553"/><stop offset="1" stop-color="#121b26"/></linearGradient>
            <radialGradient id="lens" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#cff8e7"/><stop offset=".55" stop-color="#589da1"/><stop offset="1" stop-color="#2f6b72"/></radialGradient>
            <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fe3cf"/><stop offset="1" stop-color="#5cc2ad"/></linearGradient>
          </defs>
          <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#sq)"/>
          <g class="mag">
            <circle cx="50" cy="49" r="29" fill="none" stroke="#fff" stroke-width="9.5" stroke-linecap="round" stroke-dasharray="132 60" transform="rotate(38 50 49)"/>
            <line x1="66" y1="64" x2="80" y2="78" stroke="url(#handle)" stroke-width="9" stroke-linecap="round"/>
            <circle cx="52" cy="48" r="18.5" fill="url(#lens)" stroke="#8ddccb" stroke-width="1.6"/>
            <ellipse cx="45" cy="40" rx="5.5" ry="3" fill="rgba(255,255,255,.7)" transform="rotate(-35 45 40)"/>
          </g>
        </svg>
        <span class="glint" aria-hidden="true"></span>
      </div>

      <div class="wordmark-wrap"><h1 class="wordmark">Clarity</h1></div>
      <p class="tagline">A hotkey that explains any problem on your screen.</p>

      <a class="download" id="download" href="https://github.com/s0hamjain/Clarity/releases/latest">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M4.5 7 8 10.5 11.5 7M2.5 13.5h11"/></svg>
        <span class="label">Download for macOS</span>
        <kbd aria-hidden="true" title="Press D">D</kbd>
        <span class="bar" aria-hidden="true"></span>
      </a>
      <p class="fine">Clarity.dmg · macOS 14+ · Apple Silicon · Free, open source</p>
    </div>
  </main>
  <script src="assets/site.js" defer></script>
</body>
</html>
